name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DEPENDENCIES: g++ ninja-build pkg-config libgtkmm-4.0-dev libsigc++-3.0-dev libcurl4-openssl-dev

jobs:
  test:
    if: github.event_name != 'pull_request' || github.head_ref == 'develop'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DEPENDENCIES

      # cmake_minimum_required(VERSION 4.2) is newer than the CMake shipped with Ubuntu.
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSTAPIK_COMMON_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The library has to keep compiling on Windows (MSYS2 UCRT64). The unit tests are not run there yet: they
  # still use POSIX calls (setenv, mkdtemp). The Windows specific code is exercised by the CI of the applications,
  # which run the packaged program.
  windows-build:
    if: github.event_name != 'pull_request' || github.head_ref == 'develop'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            mingw-w64-ucrt-x86_64-curl

      - name: Tool versions
        run: |
          g++ --version | head -n 1
          cmake --version | head -n 1
          pkg-config --modversion gtkmm-4.0
          curl-config --version --ssl-backends

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version and master/main
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -nE 's/^project\(stapikcommon VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)

          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version '$project_version' in CMakeLists.txt"
            exit 1
          fi

          on_default_branch=false
          for branch in master main; do
            if git rev-parse --verify --quiet "origin/$branch" > /dev/null &&
               git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
              on_default_branch=true
            fi
          done

          if [ "$on_default_branch" != "true" ]; then
            echo "Tag $GITHUB_REF_NAME is not on master or main"
            exit 1
          fi

          echo "VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DEPENDENCIES

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build release library
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Placeholder packaging until the library has install() rules (then: cmake --install).
      - name: Package
        run: |
          package="stapik-common-${VERSION}-linux-x86_64"
          mkdir -p "$package/lib" "$package/include"

          cp "$(find build -name libstapikcommon.a | head -n 1)" "$package/lib/"
          (cd src && find stapik -name '*.hpp' -print0 | xargs -0 cp --parents -t "../$package/include")

          tar -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stapik-common-${{ env.VERSION }}-linux-x86_64
          path: |
            stapik-common-${{ env.VERSION }}-linux-x86_64.tar.gz
            stapik-common-${{ env.VERSION }}-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stapik-common-${{ env.VERSION }}-linux-x86_64.tar.gz
            stapik-common-${{ env.VERSION }}-linux-x86_64.tar.gz.sha256