name: CI

# Feature branches are tested on every push. develop is skipped on purpose: everything on it
# was already tested on its feature branch, and the develop -> main pull request is tested
# below before anything reaches main. A v* tag (created on main) also builds a release package.
on:
  push:
    branches-ignore:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DEPENDENCIES: g++ ninja-build pkg-config libgtkmm-4.0-dev libsigc++-3.0-dev libcurl4-openssl-dev

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DEPENDENCIES

      # cmake_minimum_required(VERSION 4.2) is newer than the CMake shipped with Ubuntu.
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DSTAPIK_COMMON_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version and main
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -nE 's/^project\(stapikcommon VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)

          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version '$project_version' in CMakeLists.txt"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

          echo "VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $DEPENDENCIES

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build release library
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Placeholder packaging until the library has install() rules (then: cmake --install).
      - name: Package
        run: |
          package="stapik-common-${VERSION}-linux-x86_64"
          mkdir -p "$package/lib" "$package/include"

          cp "$(find build -name libstapikcommon.a | head -n 1)" "$package/lib/"
          (cd src && find stapik -name '*.hpp' -print0 | xargs -0 cp --parents -t "../$package/include")

          tar -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stapik-common-${{ env.VERSION }}-linux-x86_64
          path: |
            stapik-common-${{ env.VERSION }}-linux-x86_64.tar.gz
            stapik-common-${{ env.VERSION }}-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stapik-common-${{ env.VERSION }}-linux-x86_64.tar.gz
            stapik-common-${{ env.VERSION }}-linux-x86_64.tar.gz.sha256
