name: stapik-dependencies
buildsystem: simple
build-commands: []
modules:
  - name: libsigc++
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-examples=false
    sources:
      - type: git
        url: https://github.com/libsigcplusplus/libsigcplusplus.git
        tag: 3.6.0
  - name: glibmm
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-examples=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/glibmm.git
        tag: 2.84.0
  - name: cairomm
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-tests=false
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/cairo/cairomm.git
        tag: 1.18.0
  - name: pangomm
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/pangomm.git
        tag: 2.56.1
  - name: gtkmm
    buildsystem: meson
    config-opts:
      - -Dbuild-documentation=false
      - -Dbuild-demos=false
      - -Dbuild-tests=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/gtkmm.git
        tag: 4.18.0
  - name: libsodium
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/jedisct1/libsodium.git
        tag: 1.0.20-RELEASE
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: git
        url: https://github.com/nlohmann/json.git
        tag: v3.11.3
